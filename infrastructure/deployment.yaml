template-file-path: infrastructure/templates/parent.yaml
parameters:
  ProjectName: photo-uploader
  # ---- Filled in from bootstrap stack outputs ----
  TemplatesBaseUrl: https://s3.eu-central-1.amazonaws.com/photo-uploader-cfn-templates-825765391206-eu-central-1
  # ---- App repo identity for the GitHub Actions OIDC role (child 02-iam) ----
  GitHubOrg: Adamsmiracle
  AppRepoName: aws_lab_applications
  # ---- ECS: created at DesiredCount 0 so a fresh stack completes before any app
  # image exists in ECR (the bootstrap task def pulls from the private ECR repo via
  # VPC endpoints). App Auto Scaling (MinCapacity 2) then enforces a running floor
  # of 2 once the image is pushed — and since MinCapacity is enforced by the
  # ScalableTarget, not DesiredCount, it never triggers an ECS update on the
  # CODE_DEPLOY controller.
  MinCapacity: 2
  DesiredCount: 0
  # NOTE: ContainerCpu/ContainerMemory (parent defaults 512/1024) size only the
  # bootstrap task def. The REAL app task sizing comes from the app repo's
  # taskdef.json via CodeDeploy.
  # ---- Bumped on every infra-repo push to force nested stack refresh ----
  TemplateVersion: recreate-20260706104253
tags:
  Project: photo-uploader

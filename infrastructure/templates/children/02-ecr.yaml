AWSTemplateFormatVersion: '2010-09-09'
Description: Child stack — ECR repository + GitHub Actions OIDC role for the APP repo

Parameters:
  ProjectName:     { Type: String }
  GitHubOrg:       { Type: String }
  AppRepoName:     { Type: String }
  TemplateVersion: { Type: String }


Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-app"
      # MUTABLE so the app workflow can overwrite the `latest` tag on every build;
      # the CodePipeline ECR source action tracks `latest`. Note: no immutable
      # per-build (<sha>) tag is pushed, so there is no tag-level rollback
      # reference — CodeDeploy pins the resolved image digest in the task
      # definition at deploy time instead.
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }


  GitHubActionsEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-ecr-push-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${AppRepoName}:*"
      # The app workflow only builds and pushes the image. EventBridge (not the
      # workflow) triggers the pipeline on the ECR push, and the deploy files
      # (taskdef.json + appspec.yaml) live in the app repo and are pulled by the
      # pipeline's CodeStar source action — so this role needs ECR push perms only.
      Policies:
        - PolicyName: EcrPushPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn

Outputs:
  EcrRepositoryName:    { Value: !Ref EcrRepository }
  EcrRepositoryArn:     { Value: !GetAtt EcrRepository.Arn }
  EcrRepositoryUri:     { Value: !GetAtt EcrRepository.RepositoryUri }
  GitHubActionsRoleArn: { Value: !GetAtt GitHubActionsEcrPushRole.Arn }

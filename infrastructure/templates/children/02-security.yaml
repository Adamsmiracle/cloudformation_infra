AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Child stack — ALL security groups for the To-Do app, in one place.
  Owning every group and every rule in a single template makes the traffic
  matrix reviewable at a glance and removes the cross-stack rule juggling the
  workload stacks previously needed to break security-group dependency cycles.

  Traffic matrix (least privilege, hop by hop):
    internet :80  -> ALB
    ALB       :8080 (ContainerPort) -> ECS tasks
    ECS tasks :5432 -> RDS Proxy
    RDS Proxy :5432 -> RDS PostgreSQL
    ECS tasks :6379 -> ElastiCache Redis
    ECS tasks :443  -> VPC interface endpoints + S3 gateway endpoint

  Every ingress rule lives inline in its own group; the references between
  groups form no cycle (ALB <- tasks <- proxy <- DB, tasks <- cache), so no
  standalone rule resources are needed.

  Egress posture: every group keeps its default allow-all egress rule, so no
  egress rules are declared anywhere. The traffic matrix above is enforced
  entirely by the ingress rules on each receiving group.

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8080
  TemplateVersion:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # Edge: ALB
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ALB - open HTTP from internet"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"

  # ---------------------------------------------------------------------------
  # App tier: ECS tasks
  # ---------------------------------------------------------------------------
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ECS tasks - only ALB may talk to them"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: App traffic from ALB
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-svc-sg"

  # ---------------------------------------------------------------------------
  # Data tier: RDS Proxy + RDS
  # ---------------------------------------------------------------------------
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} RDS Proxy - ingress from ECS tasks only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
          Description: PostgreSQL from ECS tasks
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-proxy-sg"

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} RDS - ingress from RDS Proxy only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ProxySecurityGroup
          Description: PostgreSQL from RDS Proxy
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db-sg"

  # ---------------------------------------------------------------------------
  # Cache tier: ElastiCache Redis
  # ---------------------------------------------------------------------------
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} Redis - ingress from ECS tasks only"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
          Description: Redis from ECS tasks
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-redis-sg"

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
  ProxySecurityGroupId:
    Value: !Ref ProxySecurityGroup
  DbSecurityGroupId:
    Value: !Ref DbSecurityGroup
  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup

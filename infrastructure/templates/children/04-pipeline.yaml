AWSTemplateFormatVersion: '2010-09-09'
Description: Child stack — S3 → CodePipeline → CodeDeploy (ECS blue/green)

Parameters:
  ProjectName:          { Type: String }
  ClusterName:          { Type: String }
  ServiceName:          { Type: String }
  TargetGroupBlueName:  { Type: String }
  TargetGroupGreenName: { Type: String }
  HttpListenerArn:      { Type: String }
  EcrRepositoryName:    { Type: String }
  # taskdef.json + appspec.yaml now live in the app repo and are pulled via a
  # CodeStar (GitHub) connection — the pipeline no longer generates them.
  GitHubConnectionArn:  { Type: String }
  AppRepoFullName:      { Type: String }    # e.g. Adamsmiracle/aws_lab_applications
  AppRepoBranch:        { Type: String, Default: ecs-ci-cd }
  TemplateVersion:      { Type: String }

Resources:
  # ---- Artifact bucket ----
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }


  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---- IAM ----
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: codedeploy.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: CodePipelineInline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation, s3:ListBucket, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub "arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${ProjectName}-cd-app"
                  - !Sub "arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ProjectName}-cd-app/${ProjectName}-dg"
              - Effect: Allow
                Action: [codedeploy:GetApplication, codedeploy:GetDeploymentConfig]
                Resource: '*'
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServiceName}"
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition, ecs:DescribeTasks, ecs:ListTasks]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*"
                Condition:
                  StringEqualsIfExists: { iam:PassedToService: ecs-tasks.amazonaws.com }
              # Read the source image metadata (ECR source action).
              - Effect: Allow
                Action: [ecr:DescribeImages, ecr:GetAuthorizationToken]
                Resource: '*'
              # Pull taskdef.json + appspec.yaml from the app repo (CodeStar source action).
              - Effect: Allow
                Action: [codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: !Ref GitHubConnectionArn

  # ---- CodeDeploy ----
  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-cd-app"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApp
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        # CONTINUE_DEPLOYMENT = shift traffic automatically once green is healthy,
        # with no manual "Reroute traffic" approval gate (fully automated CI/CD).
        DeploymentReadyOption: { ActionOnTimeout: CONTINUE_DEPLOYMENT }
        TerminateBlueInstancesOnDeploymentSuccess: { Action: TERMINATE, TerminationWaitTimeInMinutes: 5 }
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]
      ECSServices:
        - { ClusterName: !Ref ClusterName, ServiceName: !Ref ServiceName }
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - { Name: !Ref TargetGroupBlueName }
              - { Name: !Ref TargetGroupGreenName }
            ProdTrafficRoute: { ListenerArns: [!Ref HttpListenerArn] }
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce

  # ---- EventBridge ----
  EventBridgePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-eventbridge-pipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline"

  EcrImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ecr-push-rule"
      Description: Trigger CodePipeline when a new image is pushed to ECR
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepositoryName
          # Scope to the `latest` tag — the only tag the app workflow pushes.
          # The ECR push event is the single deploy trigger.
          image-tag:
            - latest
      State: ENABLED
      Targets:
        - Id: TriggerPipeline
          Arn: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline"
          RoleArn: !GetAtt EventBridgePipelineRole.Arn

  # ---- CodePipeline ----
  # Flow: app pushes image -> EventBridge fires on ECR push -> this pipeline runs.
  #   Source : two actions in parallel —
  #     EcrSource : `latest` image metadata from ECR (imageDetail.json).
  #     AppSource : taskdef.json + appspec.yaml pulled from the app repo via the
  #                 CodeStar connection (DetectChanges off — only the ECR push
  #                 triggers a run, so a deploy always grabs the current files).
  #   Deploy : CodeDeploy blue/green swap on the ECS service.
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: EcrSource
              ActionTypeId: { Category: Source, Owner: AWS, Provider: ECR, Version: '1' }
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: latest
              OutputArtifacts: [{ Name: ImageArtifact }]
              RunOrder: 1
            - Name: AppSource
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: '1' }
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref AppRepoFullName
                BranchName: !Ref AppRepoBranch
                OutputArtifactFormat: CODE_ZIP
                # Off so a repo push doesn't double-trigger; the ECR push is the
                # single trigger and reads whatever taskdef/appspec is current.
                DetectChanges: false
              OutputArtifacts: [{ Name: SourceArtifact }]
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeployToECS, Version: '1' }
              Configuration:
                ApplicationName: !Ref CodeDeployApp
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: SourceArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts: [{ Name: ImageArtifact }, { Name: SourceArtifact }]
              RunOrder: 1

Outputs:
  PipelineName:      { Value: !Ref Pipeline }
  ArtifactBucket:    { Value: !Ref ArtifactBucket }
  ArtifactBucketArn: { Value: !GetAtt ArtifactBucket.Arn }
  CodeDeployApp:     { Value: !Ref CodeDeployApp }

AWSTemplateFormatVersion: '2010-09-09'
Description: Child stack — S3 → CodePipeline → CodeDeploy (ECS blue/green)

Parameters:
  ProjectName:          { Type: String }
  ClusterName:          { Type: String }
  ServiceName:          { Type: String }
  TargetGroupBlueName:  { Type: String }
  TargetGroupGreenName: { Type: String }
  HttpListenerArn:      { Type: String }
  EcrRepositoryName:    { Type: String }
  # Injected into CodeBuild so the generated taskdef.json matches the ECS stack.
  TaskExecutionRoleArn: { Type: String }
  TaskRoleArn:          { Type: String }
  ContainerPort:        { Type: Number, Default: 8080 }
  ContainerCpu:         { Type: Number, Default: 512 }
  ContainerMemory:      { Type: Number, Default: 1024 }
  TemplateVersion:      { Type: String }

Resources:
  # ---- Artifact bucket ----
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }


  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---- IAM ----
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: codedeploy.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: CodePipelineInline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation, s3:ListBucket, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub "arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${ProjectName}-cd-app"
                  - !Sub "arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ProjectName}-cd-app/${ProjectName}-dg"
              - Effect: Allow
                Action: [codedeploy:GetApplication, codedeploy:GetDeploymentConfig]
                Resource: '*'
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServiceName}"
              - Effect: Allow
                Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition, ecs:DescribeTasks, ecs:ListTasks]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*"
                Condition:
                  StringEqualsIfExists: { iam:PassedToService: ecs-tasks.amazonaws.com }
              # Read the source image metadata (ECR source action).
              - Effect: Allow
                Action: [ecr:DescribeImages, ecr:GetAuthorizationToken]
                Resource: '*'
              # Drive the CodeBuild stage that generates taskdef.json + appspec.yaml.
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds, codebuild:StopBuild]
                Resource: !GetAtt DeployFilesProject.Arn

  # ---- CodeBuild (generates taskdef.json + appspec.yaml at deploy time) ----
  # Keeping deploy-file generation here means the app repo never needs to know
  # task role ARNs, the log group, CPU/memory, etc. The pipeline owns it.
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: CodeBuildInline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-deploy-files:*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"

  DeployFilesProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-deploy-files"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: PROJECT_NAME,        Value: !Ref ProjectName }
          - { Name: EXECUTION_ROLE_ARN,  Value: !Ref TaskExecutionRoleArn }
          - { Name: TASK_ROLE_ARN,       Value: !Ref TaskRoleArn }
          - { Name: CONTAINER_NAME,      Value: app }
          - { Name: CONTAINER_PORT,      Value: !Ref ContainerPort }
          - { Name: CONTAINER_CPU,       Value: !Ref ContainerCpu }
          - { Name: CONTAINER_MEMORY,    Value: !Ref ContainerMemory }
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - |
                  jq -n \
                    --arg exec "$EXECUTION_ROLE_ARN" \
                    --arg task "$TASK_ROLE_ARN" \
                    --arg region "$AWS_DEFAULT_REGION" \
                    --arg family "$PROJECT_NAME-task" \
                    --arg loggroup "/ecs/$PROJECT_NAME" \
                    --arg cname "$CONTAINER_NAME" \
                    --argjson port "$CONTAINER_PORT" \
                    --arg cpu "$CONTAINER_CPU" \
                    --arg mem "$CONTAINER_MEMORY" \
                    '{
                      family: $family,
                      networkMode: "awsvpc",
                      requiresCompatibilities: ["FARGATE"],
                      cpu: $cpu,
                      memory: $mem,
                      executionRoleArn: $exec,
                      taskRoleArn: $task,
                      runtimePlatform: { operatingSystemFamily: "LINUX", cpuArchitecture: "X86_64" },
                      containerDefinitions: [{
                        name: $cname,
                        image: "<IMAGE1_NAME>",
                        essential: true,
                        portMappings: [{containerPort: $port, protocol: "tcp"}],
                        logConfiguration: {
                          logDriver: "awslogs",
                          options: {
                            "awslogs-group": $loggroup,
                            "awslogs-region": $region,
                            "awslogs-stream-prefix": "app"
                          }
                        }
                      }]
                    }' > taskdef.json
                - |
                  cat > appspec.yaml << EOF
                  version: 0.0
                  Resources:
                    - TargetService:
                        Type: AWS::ECS::Service
                        Properties:
                          TaskDefinition: <TASK_DEFINITION>
                          LoadBalancerInfo:
                            ContainerName: "$CONTAINER_NAME"
                            ContainerPort: $CONTAINER_PORT
                  EOF
                - echo "Generated taskdef.json:"; cat taskdef.json
          artifacts:
            files:
              - taskdef.json
              - appspec.yaml

  # ---- CodeDeploy ----
  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-cd-app"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApp
      DeploymentGroupName: !Sub "${ProjectName}-dg"
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        # CONTINUE_DEPLOYMENT = shift traffic automatically once green is healthy,
        # with no manual "Reroute traffic" approval gate (fully automated CI/CD).
        DeploymentReadyOption: { ActionOnTimeout: CONTINUE_DEPLOYMENT }
        TerminateBlueInstancesOnDeploymentSuccess: { Action: TERMINATE, TerminationWaitTimeInMinutes: 5 }
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]
      ECSServices:
        - { ClusterName: !Ref ClusterName, ServiceName: !Ref ServiceName }
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - { Name: !Ref TargetGroupBlueName }
              - { Name: !Ref TargetGroupGreenName }
            ProdTrafficRoute: { ListenerArns: [!Ref HttpListenerArn] }
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce

  # ---- EventBridge ----
  EventBridgePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-eventbridge-pipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline"

  EcrImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-ecr-push-rule"
      Description: Trigger CodePipeline when a new image is pushed to ECR
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepositoryName
          # Only the `latest` tag triggers a deploy. The app workflow also pushes a
          # per-build <sha> tag; without this filter every push would fire twice.
          image-tag:
            - latest
      State: ENABLED
      Targets:
        - Id: TriggerPipeline
          Arn: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline"
          RoleArn: !GetAtt EventBridgePipelineRole.Arn

  # ---- CodePipeline ----
  # Flow: app pushes image -> EventBridge fires on ECR push -> this pipeline runs.
  #   Source  : pull the `latest` image metadata straight from ECR (imageDetail.json).
  #   Build   : CodeBuild generates taskdef.json + appspec.yaml.
  #   Deploy  : CodeDeploy blue/green swap on the ECS service.
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: EcrSource
              ActionTypeId: { Category: Source, Owner: AWS, Provider: ECR, Version: '1' }
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: latest
              OutputArtifacts: [{ Name: ImageArtifact }]
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: GenerateDeployFiles
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1' }
              Configuration:
                ProjectName: !Ref DeployFilesProject
              InputArtifacts: [{ Name: ImageArtifact }]
              OutputArtifacts: [{ Name: DeployArtifact }]
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeployToECS, Version: '1' }
              Configuration:
                ApplicationName: !Ref CodeDeployApp
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: DeployArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: DeployArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts: [{ Name: ImageArtifact }, { Name: DeployArtifact }]
              RunOrder: 1

Outputs:
  PipelineName:      { Value: !Ref Pipeline }
  ArtifactBucket:    { Value: !Ref ArtifactBucket }
  ArtifactBucketArn: { Value: !GetAtt ArtifactBucket.Arn }
  CodeDeployApp:     { Value: !Ref CodeDeployApp }

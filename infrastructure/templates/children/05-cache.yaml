AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Child stack — Amazon ElastiCache (Redis) for the To-Do app read cache.
  Nodes run in the dedicated cache-tier private subnets and accept traffic
  only from the ECS service. The cache security group is owned by the security
  stack (02-security.yaml) and arrives as a parameter. The app reads the
  endpoint from SSM.

Parameters:
  ProjectName:
    Type: String
  CacheSecurityGroupId:
    Type: String
  CacheSubnet1:
    Type: String
  CacheSubnet2:
    Type: String
  CacheNodeType:
    Type: String
    Default: cache.t3.micro
  TemplateVersion:
    Type: String


Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub "${ProjectName}-redis-subnets"
      Description: !Sub "${ProjectName} Redis subnet group (cache tier)"
      SubnetIds:
        - !Ref CacheSubnet1
        - !Ref CacheSubnet2

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ReplicationGroupId: !Sub "${ProjectName}-redis"
      ReplicationGroupDescription: !Sub "${ProjectName} Redis read cache"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      MultiAZEnabled: false
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref CacheSecurityGroupId
      Port: 6379
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-redis"

  RedisEndpointParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/redis-endpoint"
      Type: String
      Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address

  RedisPortParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${ProjectName}/redis-port"
      Type: String
      Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port

Outputs:
  RedisPrimaryEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  RedisPort:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port

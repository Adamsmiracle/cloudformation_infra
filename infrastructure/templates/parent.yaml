AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Parent stack for the To-Do app lab (ECS Fargate + RDS via RDS Proxy +
  ElastiCache Redis). Deployed by CloudFormation GitSync. Instantiates nested
  stacks whose templates live in S3 (uploaded by GitHub Actions in this repo).
  Parent passes parameters down; children return outputs that other children
  consume via !GetAtt …Outputs.X.

  Layers (industry-standard, by lifecycle):
    01 network  → multi-AZ VPC, dedicated subnets per tier, endpoints
    02 iam      → all application IAM roles
    04 database → RDS PostgreSQL (Multi-AZ) + RDS Proxy + Secrets Manager
    05 ecr      → image registry
    06 alb-ecs  → ALB + ECS Fargate + autoscaling (+ security groups)
    07 pipeline → CodePipeline + CodeDeploy + EventBridge
    08 cache    → ElastiCache Redis read cache


Parameters:
  ProjectName:
    Type: String
    Default: todo-app
  TemplatesBaseUrl:
    Type: String
    Description: HTTPS prefix for child templates, e.g. https://s3.eu-central-1.amazonaws.com/<bucket>

  # ---- Networking ----
  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.30.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.30.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.30.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.30.11.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.30.20.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.30.21.0/24
  CacheSubnet1Cidr:
    Type: String
    Default: 10.30.30.0/24
  CacheSubnet2Cidr:
    Type: String
    Default: 10.30.31.0/24

  # ---- GitHub / OIDC (for the APP-repo workflow's ECR-push + deploy-bundle role) ----
  GitHubOrg:
    Type: String
    Default: Adamsmiracle
  AppRepoName:
    Type: String
    Default: aws_lab_applications

  # ---- Database ----
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBName:
    Type: String
    Default: todoapp
  DBUsername:
    Type: String
    Default: todo_admin
  DBMultiAZ:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

  # ---- Cache ----
  CacheNodeType:
    Type: String
    Default: cache.t3.micro

  # ---- ECS sizing ----
  ContainerPort:
    Type: Number
    Default: 8080
  DesiredCount:
    Type: Number
    Default: 1
  MinCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuTargetUtilization:
    Type: Number
    Default: 60
  TemplateVersion:
    Type: String
    Default: initial
    Description: Bumped on every infra-repo push to force nested stack refresh

Resources:

  # -------------------------------------------------------------------------
  # Child 1 — Networking
  # -------------------------------------------------------------------------
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/01-network.yaml"
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:        !Ref ProjectName
        VpcCidr:            !Ref VpcCidr
        PublicSubnet1Cidr:  !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr:  !Ref PublicSubnet2Cidr
        AppSubnet1Cidr:     !Ref AppSubnet1Cidr
        AppSubnet2Cidr:     !Ref AppSubnet2Cidr
        DataSubnet1Cidr:    !Ref DataSubnet1Cidr
        DataSubnet2Cidr:    !Ref DataSubnet2Cidr
        CacheSubnet1Cidr:   !Ref CacheSubnet1Cidr
        CacheSubnet2Cidr:   !Ref CacheSubnet2Cidr
        TemplateVersion:    !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: network

  # -------------------------------------------------------------------------
  # Child 2 — IAM (all application IAM roles)
  # -------------------------------------------------------------------------
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/02-iam.yaml"
      TimeoutInMinutes: 10
      Parameters:
        ProjectName:         !Ref ProjectName
        GitHubOrg:           !Ref GitHubOrg
        AppRepoName:         !Ref AppRepoName
        TemplateVersion:     !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: iam

  # -------------------------------------------------------------------------
  # Child 4 — Database (RDS PostgreSQL Multi-AZ + RDS Proxy + Secrets Manager)
  # -------------------------------------------------------------------------
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/04-database.yaml"
      TimeoutInMinutes: 40
      Parameters:
        ProjectName:     !Ref ProjectName
        VpcId:           !GetAtt NetworkStack.Outputs.VpcId
        DataSubnet1:     !GetAtt NetworkStack.Outputs.DataSubnet1
        DataSubnet2:     !GetAtt NetworkStack.Outputs.DataSubnet2
        DBInstanceClass: !Ref DBInstanceClass
        DBName:          !Ref DBName
        DBUsername:      !Ref DBUsername
        MultiAZ:         !Ref DBMultiAZ
        TemplateVersion: !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: database

  # -------------------------------------------------------------------------
  # Child 5 — ECR registry
  # -------------------------------------------------------------------------
  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/05-ecr.yaml"
      TimeoutInMinutes: 10
      Parameters:
        ProjectName:     !Ref ProjectName
        TemplateVersion: !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: registry

  # -------------------------------------------------------------------------
  # Child 6 — ALB + ECS Fargate + autoscaling
  # -------------------------------------------------------------------------
  AlbEcsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/06-alb-ecs.yaml"
      TimeoutInMinutes: 20
      Parameters:
        ProjectName:           !Ref ProjectName
        VpcId:                 !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr:               !GetAtt NetworkStack.Outputs.VpcCidr
        PublicSubnet1:         !GetAtt NetworkStack.Outputs.PublicSubnet1
        PublicSubnet2:         !GetAtt NetworkStack.Outputs.PublicSubnet2
        AppSubnet1:            !GetAtt NetworkStack.Outputs.AppSubnet1
        AppSubnet2:            !GetAtt NetworkStack.Outputs.AppSubnet2
        ContainerPort:         !Ref ContainerPort
        DesiredCount:          !Ref DesiredCount
        MinCapacity:           !Ref MinCapacity
        MaxCapacity:           !Ref MaxCapacity
        CpuTargetUtilization:  !Ref CpuTargetUtilization
        ProxySecurityGroupId:  !GetAtt DatabaseStack.Outputs.ProxySecurityGroupId
        CacheSecurityGroupId:  !GetAtt CacheStack.Outputs.CacheSecurityGroupId
        TemplateVersion:       !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: compute

  # -------------------------------------------------------------------------
  # Child 7 — CI/CD pipeline (ECR push → EventBridge → CodePipeline → CodeDeploy)
  # -------------------------------------------------------------------------
  PipelineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/07-pipeline.yaml"
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:          !Ref ProjectName
        ClusterName:          !GetAtt AlbEcsStack.Outputs.ClusterName
        ServiceName:          !GetAtt AlbEcsStack.Outputs.ServiceName
        TargetGroupBlueName:  !GetAtt AlbEcsStack.Outputs.TargetGroupBlueName
        TargetGroupGreenName: !GetAtt AlbEcsStack.Outputs.TargetGroupGreenName
        HttpListenerArn:      !GetAtt AlbEcsStack.Outputs.HttpListenerArn
        EcrRepositoryName:    !GetAtt EcrStack.Outputs.EcrRepositoryName
        CodeDeployRoleArn:    !GetAtt IamStack.Outputs.CodeDeployRoleArn
        CodePipelineRoleArn:  !GetAtt IamStack.Outputs.CodePipelineRoleArn
        EventBridgeRoleArn:   !GetAtt IamStack.Outputs.EventBridgePipelineRoleArn
        TemplateVersion:      !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: cicd

  # -------------------------------------------------------------------------
  # Child 8 — ElastiCache Redis read cache
  # -------------------------------------------------------------------------
  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBaseUrl}/children/08-cache.yaml"
      TimeoutInMinutes: 30
      Parameters:
        ProjectName:     !Ref ProjectName
        VpcId:           !GetAtt NetworkStack.Outputs.VpcId
        CacheSubnet1:    !GetAtt NetworkStack.Outputs.CacheSubnet1
        CacheSubnet2:    !GetAtt NetworkStack.Outputs.CacheSubnet2
        CacheNodeType:   !Ref CacheNodeType
        TemplateVersion: !Ref TemplateVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: cache

Outputs:
  AlbDns:
    Description: Public URL of the To-Do application
    Value: !Sub "http://${AlbEcsStack.Outputs.AlbDnsName}"
  DbProxyEndpoint:
    Description: RDS Proxy endpoint the app connects to (private)
    Value: !GetAtt DatabaseStack.Outputs.DbProxyEndpoint
  DbEndpoint:
    Description: Raw RDS PostgreSQL endpoint (private)
    Value: !GetAtt DatabaseStack.Outputs.DbEndpointAddress
  RedisEndpoint:
    Description: ElastiCache Redis primary endpoint (private)
    Value: !GetAtt CacheStack.Outputs.RedisPrimaryEndpoint
  EcrRepositoryUri:
    Value: !GetAtt EcrStack.Outputs.EcrRepositoryUri
  GitHubActionsRoleArn:
    Description: For the APP repo workflow (ECR push + deploy bundle)
    Value: !GetAtt IamStack.Outputs.GitHubActionsEcrPushRoleArn
  DeploySourceBucket:
    Description: Where the app workflow uploads deploy-bundle.zip (taskdef.json + appspec.yaml)
    Value: !GetAtt PipelineStack.Outputs.DeploySourceBucket
  PipelineName:
    Value: !GetAtt PipelineStack.Outputs.PipelineName

name: Sync Infrastructure Templates

on:
  push:
    branches: [todo]
    paths:
      - 'infrastructure/templates/parent.yaml'
      - 'infrastructure/templates/children/**'

permissions:
  id-token: write   # OIDC token for AWS
  contents: write   # push the TemplateVersion bump back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TODO_INFRA_GHA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Mirror the entire templates/ tree to S3 on every push. `sync` uploads
      # new/changed files and `--delete` removes any object no longer in the
      # repo, so the bucket always fully reflects the branch — including the
      # first push after the bucket is (re)created for a review teardown.
      - name: Sync all templates to S3
        run: |
          aws s3 sync infrastructure/templates/ \
            "s3://${{ secrets.TODO_TEMPLATES_BUCKET }}/" \
            --delete

      - name: Bump TemplateVersion in deployment.yaml
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/^  TemplateVersion:.*/  TemplateVersion: sha-${SHORT_SHA}/" \
            infrastructure/deployment.yaml

      - name: Commit and push TemplateVersion bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/deployment.yaml
          # Nothing changed (templates re-synced but content identical) → skip.
          if git diff --cached --quiet; then
            echo "TemplateVersion unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "ci: bump TemplateVersion to sha-$(echo ${{ github.sha }} | cut -c1-7)"
          # The branch may have advanced (concurrent runs, manual pushes), so a
          # plain push can be rejected non-fast-forward. Rebase our single bump
          # commit onto the latest todo and retry a few times before failing.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:todo; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto latest todo (attempt $attempt)."
            git pull --rebase origin todo
          done
          echo "Failed to push TemplateVersion bump after 5 attempts." >&2
          exit 1
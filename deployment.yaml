# ---------- 1. Network stack ----------
network:
  template-file-path: templates/network.yaml
  parameters:
    ProjectName: ecs-ci-cd
  tags:
    Project: ecs-ci-cd
    Layer: network

# ---------- 2. ECR + GitHub OIDC ----------
ecr-oidc:
  template-file-path: templates/ecr-oidc.yaml
  parameters:
    ProjectName: ecs-ci-cd
    GitHubOrg: your-github-org           # <-- replace
    AppRepoName: fullstack-lab-app       # <-- replace if different
  tags:
    Project: ecs-ci-cd
    Layer: registry

# ---------- 3. ALB + ECS ----------
alb-ecs:
  template-file-path: templates/alb-ecs.yaml
  parameters:
    ProjectName: ecs-ci-cd
    ContainerPort: 8080
    DesiredCount: 1
    MinCapacity: 1
    MaxCapacity: 4
    CpuTargetUtilization: 60
  tags:
    Project: ecs-ci-cd
    Layer: compute

# ---------- 4. Pipeline ----------
pipeline:
  template-file-path: templates/pipeline.yaml
  parameters:
    ProjectName: ecs-ci-cd
    ImageTag: latest
    ContainerPort: 8080
  tags:
    Project: ecs-ci-cd
    Layer: cicd
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD pipeline: EventBridge rule fires on ECR image push -> CodePipeline ->
  CodeDeploy (ECS blue/green). Source artifact is built on the fly from the
  ECR event by a small CodeBuild project that generates the imagedefinitions
  and appspec/taskdef files.

Parameters:
  ProjectName:
    Type: String
    Default: ecs-ci-cd-lab
  ImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8080

Resources:
  # ---------- Artifact bucket ----------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-pipeline-artifacts-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------- IAM roles ----------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildInline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelineInline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt PrepareBuildProject.Arn
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                  - codedeploy:GetDeploymentConfig
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:DescribeImages
                Resource: '*'

  EventBridgePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-pipeline

  # ---------- CodeBuild: generates taskdef.json + appspec.yaml + imageDetail.json ----------
  PrepareBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-prepare-deploy
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-EcrRepoUri
          - Name: IMAGE_TAG
            Value: !Ref ImageTag
          - Name: CONTAINER_PORT
            Value: !Ref ContainerPort
          - Name: TASK_EXEC_ROLE_ARN
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-TaskExecutionRoleArn
          - Name: TASK_ROLE_ARN
            Value:
              Fn::ImportValue: !Sub ${ProjectName}-TaskRoleArn
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Generating deployment artifacts for $ECR_REPO_URI:$IMAGE_TAG"
                - |
                  cat > taskdef.json <<EOF
                  {
                    "family": "${PROJECT_NAME}-task",
                    "networkMode": "awsvpc",
                    "requiresCompatibilities": ["FARGATE"],
                    "cpu": "512",
                    "memory": "1024",
                    "executionRoleArn": "$TASK_EXEC_ROLE_ARN",
                    "taskRoleArn": "$TASK_ROLE_ARN",
                    "containerDefinitions": [
                      {
                        "name": "app",
                        "image": "<IMAGE1_NAME>",
                        "essential": true,
                        "portMappings": [
                          { "containerPort": $CONTAINER_PORT, "protocol": "tcp" }
                        ],
                        "logConfiguration": {
                          "logDriver": "awslogs",
                          "options": {
                            "awslogs-group": "/ecs/${PROJECT_NAME}",
                            "awslogs-region": "$AWS_REGION",
                            "awslogs-stream-prefix": "app"
                          }
                        }
                      }
                    ]
                  }
                  EOF
                - |
                  cat > appspec.yaml <<EOF
                  version: 0.0
                  Resources:
                    - TargetService:
                        Type: AWS::ECS::Service
                        Properties:
                          TaskDefinition: <TASK_DEFINITION>
                          LoadBalancerInfo:
                            ContainerName: "app"
                            ContainerPort: $CONTAINER_PORT
                          PlatformVersion: "LATEST"
                  EOF
                - |
                  cat > imageDetail.json <<EOF
                  { "ImageURI": "$ECR_REPO_URI:$IMAGE_TAG" }
                  EOF
                - cat taskdef.json appspec.yaml imageDetail.json
          artifacts:
            files:
              - taskdef.json
              - appspec.yaml
              - imageDetail.json

  # ---------- CodeDeploy application + deployment group ----------
  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-cd-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApp
      DeploymentGroupName: !Sub ${ProjectName}-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      ECSServices:
        - ClusterName:
            Fn::ImportValue: !Sub ${ProjectName}-ClusterName
          ServiceName:
            Fn::ImportValue: !Sub ${ProjectName}-ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name:
                  Fn::ImportValue: !Sub ${ProjectName}-TgBlueName
              - Name:
                  Fn::ImportValue: !Sub ${ProjectName}-TgGreenName
            ProdTrafficRoute:
              ListenerArns:
                - Fn::ImportValue: !Sub ${ProjectName}-HttpListenerArn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce

  # ---------- Pipeline ----------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: EcrSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName:
                  Fn::ImportValue: !Sub ${ProjectName}-EcrRepoName
                ImageTag: !Ref ImageTag
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Prepare
          Actions:
            - Name: GenerateDeployFiles
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref PrepareBuildProject
                EnvironmentVariables: !Sub |
                  [{"name":"PROJECT_NAME","value":"${ProjectName}"},{"name":"AWS_REGION","value":"${AWS::Region}"}]
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: DeployArtifact
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApp
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: DeployArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: DeployArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: DeployArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: DeployArtifact

  # ---------- EventBridge: fire on ECR image push ----------
  EcrImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-ecr-push-rule
      Description: Start CodePipeline when a new image is pushed to ECR
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - Fn::ImportValue: !Sub ${ProjectName}-EcrRepoName
          image-tag:
            - !Ref ImageTag
      Targets:
        - Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          Id: PipelineTarget
          RoleArn: !GetAtt EventBridgePipelineRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CodeDeployApplication:
    Value: !Ref CodeDeployApp
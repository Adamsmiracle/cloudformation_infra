AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository and the OIDC IAM role assumed by the app-repo GitHub Actions
  workflow. No long-lived AWS keys live in GitHub.

Parameters:
  ProjectName:
    Type: String
    Default: ecs-ci-cd-lab
  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the application repo
    Default: Adamsmiracle
  AppRepoName:
    Type: String
    Description: Name of the GitHub repo holding the application code
    Default: aws_lab_applications

Resources:
  # ---------- ECR ----------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-app
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ---------- GitHub OIDC provider (one per AWS account) ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ---------- Role GitHub Actions assumes ----------
  GitHubActionsEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-gha-ecr-push-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${AppRepoName}:*
      Policies:
        - PolicyName: EcrPushPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt EcrRepository.Arn

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub ${ProjectName}-EcrRepoUri
  EcrRepositoryName:
    Value: !Ref EcrRepository
    Export:
      Name: !Sub ${ProjectName}-EcrRepoName
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export:
      Name: !Sub ${ProjectName}-EcrRepoArn
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsEcrPushRole.Arn
    Export:
      Name: !Sub ${ProjectName}-GitHubActionsRoleArn